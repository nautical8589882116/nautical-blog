# Deploy blog static files to Azure Static Web Apps.
# In Azure Portal: create Static Web App → GitHub → this repo → app location "/"
# Then set repository secret AZURE_STATIC_WEB_APPS_API_TOKEN from the SWA deployment token.
name: Azure Static Web Apps CI/CD
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: ""
          skip_app_build: true
          skip_api_build: true
